<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevPulse — Customer Health Score</title>

  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #f5f5f4;
      color: #1a1a1a;
    }
    .wrapper { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px 0; color: #1a1a1a; }
    .subtitle { font-size: 14px; color: #6b7280; margin: 0 0 1.5rem 0; }
    .card { background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .card-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 1rem 0; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 5px; }
    .field input, .field select { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; background-color: #ffffff; color: #1a1a1a; }
    .field input:focus, .field select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
    button { width: 100%; padding: 11px; font-size: 15px; font-weight: 500; color: #ffffff; background-color: #6366f1; border: none; border-radius: 8px; cursor: pointer; margin-top: 4px; margin-bottom: 1rem; }
    button:hover { background-color: #4f46e5; }
    button:active { background-color: #4338ca; }
    .score-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    #score-num { font-size: 52px; font-weight: 600; line-height: 1; color: #1a1a1a; }
    #tier-badge { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; }
    .bar-bg { height: 8px; border-radius: 4px; background-color: #e5e7eb; margin-bottom: 1rem; }
    .bar-fill { height: 8px; border-radius: 4px; transition: width 0.4s ease; }
    #reasoning-text { font-size: 14px; color: #6b7280; line-height: 1.7; margin-bottom: 1rem; }
    .actions-label { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    .action-item { font-size: 13px; color: #1a1a1a; padding: 8px 12px; border-left: 3px solid; margin-bottom: 6px; line-height: 1.5; background-color: #f9fafb; border-radius: 0 6px 6px 0; }
  </style>
</head>

<body>
  <div class="wrapper">

    <h1>DevPulse</h1>
    <p class="subtitle">Developer customer health score calculator</p>

    <div class="card">
      <p class="card-label">Usage signals</p>
      <div class="field">
        <label for="trend">API call volume trend</label>
        <select id="trend">
          <option value="growing">Growing</option>
          <option value="stable">Stable</option>
          <option value="declining">Declining</option>
        </select>
      </div>
      <div class="field">
        <label for="tickets">Support tickets (last 30 days)</label>
        <input type="number" id="tickets" min="0" placeholder="e.g. 3" />
      </div>
    </div>

    <div class="card">
      <p class="card-label">Engagement signals</p>
      <div class="field">
        <label for="lastlogin">Last login (days ago)</label>
        <input type="number" id="lastlogin" min="0" placeholder="e.g. 5" />
      </div>
      <div class="field">
        <label for="docs">Docs page visits</label>
        <select id="docs">
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Relationship signals</p>
      <div class="field">
        <label for="renewal">Days until contract renewal</label>
        <input type="number" id="renewal" min="0" placeholder="e.g. 120" />
      </div>
      <div class="field">
        <label for="nps">NPS / CSAT score (0–10)</label>
        <input type="number" id="nps" min="0" max="10" placeholder="e.g. 8" />
      </div>
    </div>

    <button onclick="calculate()">Calculate health score</button>

    <div class="card" id="result-card" style="display: none;">
      <p class="card-label">Health score</p>
      <div class="score-row">
        <span id="score-num">—</span>
        <span id="tier-badge">—</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="score-bar"></div>
      </div>
      <p id="reasoning-text"></p>
      <p class="actions-label">Recommended actions</p>
      <div id="actions-list"></div>
    </div>

  </div>

  <script>
    function calculate() {

      // --- INPUT VALIDATION ---
      // Check all number fields are filled before running the score.
      // Without this, empty fields silently default to 0, which would
      // produce a misleading health score.
      if (document.getElementById('tickets').value === '' ||
          document.getElementById('lastlogin').value === '' ||
          document.getElementById('renewal').value === '' ||
          document.getElementById('nps').value === '') {
        alert('Please fill in all fields before calculating.');
        return;
      }

      // --- JOB 1: READ ---
      var trend     = document.getElementById('trend').value;
      var tickets   = parseInt(document.getElementById('tickets').value)   || 0;
      var lastlogin = parseInt(document.getElementById('lastlogin').value) || 0;
      var docs      = document.getElementById('docs').value;
      var renewal   = parseInt(document.getElementById('renewal').value)   || 0;
      var nps       = parseInt(document.getElementById('nps').value)       || 0;

      // --- JOB 2: SCORE ---
      var score = 0;
      var flags = [];

      if (trend === 'growing')     { score += 25; }
      else if (trend === 'stable') { score += 15; }
      else                         { score += 0;  flags.push('declining API usage'); }

      if (tickets === 0)           { score += 20; }
      else if (tickets <= 2)       { score += 15; }
      else if (tickets <= 5)       { score += 8;  }
      else                         { score += 0;  flags.push('high support ticket volume'); }

      if (lastlogin <= 3)          { score += 20; }
      else if (lastlogin <= 7)     { score += 15; }
      else if (lastlogin <= 14)    { score += 8;  }
      else                         { score += 0;  flags.push('no recent login activity'); }

      if (docs === 'high')         { score += 15; }
      else if (docs === 'medium')  { score += 10; }
      else                         { score += 3;  flags.push('minimal docs engagement'); }

      if (renewal > 180)           { score += 10; }
      else if (renewal > 90)       { score += 8;  }
      else if (renewal > 30)       { score += 4;  }
      else                         { score += 0;  flags.push('renewal window under 30 days'); }

      if (nps >= 9)                { score += 10; }
      else if (nps >= 7)           { score += 7;  }
      else if (nps >= 5)           { score += 3;  }
      else                         { score += 0;  flags.push('low satisfaction score'); }

      score = Math.min(100, Math.max(0, score));

      // --- JOB 3: DECIDE ---
      var tier, color, reasoning, actions;

      if (score >= 75) {
        tier = 'Healthy';
        color = '#3B6D11';
        reasoning = 'This account shows strong, consistent engagement across usage, support, and sentiment signals. '
          + (flags.length === 0 ? 'No significant risk factors detected.' : 'Minor areas to watch: ' + flags.join(', ') + '.');
        actions = [
          'Schedule a quarterly business review to reinforce the relationship.',
          'Identify expansion or upsell opportunities given strong engagement.',
          'Request a case study or referral while sentiment is high.'
        ];
      } else if (score >= 50) {
        tier = 'Needs attention';
        color = '#BA7517';
        reasoning = 'This account is engaged but showing mixed signals. Risk factors include: '
          + (flags.length > 0 ? flags.join(', ') : 'moderate scores across multiple dimensions')
          + '. Proactive outreach is recommended before these signals worsen.';
        actions = [
          'Reach out with a personalized check-in within 5 business days.',
          'Review recent support tickets for unresolved friction points.',
          'Share relevant docs or feature updates based on their use case.'
        ];
      } else if (score >= 25) {
        tier = 'At risk';
        color = '#D85A30';
        reasoning = 'Several health signals are below threshold: '
          + (flags.length > 0 ? flags.join(', ') : 'multiple weak signals across categories')
          + '. Without direct intervention, churn risk is elevated.';
        actions = [
          'Escalate to account lead for an executive-level touchpoint.',
          'Conduct a root cause review of recent support ticket themes.',
          'Offer a dedicated onboarding or re-engagement session this week.'
        ];
      } else {
        tier = 'Critical';
        color = '#A32D2D';
        reasoning = 'This account is exhibiting critical risk signals across multiple dimensions: '
          + (flags.length > 0 ? flags.join(', ') : 'widespread low engagement')
          + '. Immediate intervention is required to prevent churn.';
        actions = [
          'Initiate an emergency account review within 24 hours.',
          'Loop in CSM leadership and prepare a formal save plan.',
          'Identify and address blockers in a dedicated call this week.'
        ];
      }

      // --- JOB 4: WRITE ---
      document.getElementById('score-num').textContent = score;

      var badge = document.getElementById('tier-badge');
      badge.textContent = tier;
      badge.style.backgroundColor = color + '22';
      badge.style.color = color;

      var bar = document.getElementById('score-bar');
      bar.style.width = score + '%';
      bar.style.backgroundColor = color;

      document.getElementById('reasoning-text').textContent = reasoning;

      var actionsList = document.getElementById('actions-list');
      actionsList.innerHTML = '';
      actions.forEach(function(actionText) {
        var item = document.createElement('div');
        item.className = 'action-item';
        item.style.borderLeftColor = color;
        item.textContent = actionText;
        actionsList.appendChild(item);
      });

      var resultCard = document.getElementById('result-card');
      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>

</body>
</html>
